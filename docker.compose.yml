services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=django_db
      - POSTGRES_USER=usuario_db
      - POSTGRES_PASSWORD=senha_secreta
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: ./app
    command: gunicorn django_docker_compose.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ./app:/app
      - static_volume:/app/static
      - media_volume:/app/media
    environment:
      - DB_HOST=db
      - DB_NAME=django_db
      - DB_USER=usuario_db
      - DB_PASS=senha_secreta
    depends_on:
      - db

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/static
      - media_volume:/var/www/media
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume: